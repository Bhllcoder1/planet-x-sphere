<!DOCTYPE html>
<!--
  aladin_panel_test.html — Manual test harness for aladin_panel.html
  Lets a tester pick any of the 5 SPHEREx targets from a dropdown
  and open the panel with the correct URL parameters.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aladin Panel — Test Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 24px;
    }
    h1 { font-size: 22px; color: #58a6ff; }
    p  { color: #8b949e; font-size: 14px; text-align: center; max-width: 540px; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label { font-size: 13px; color: #8b949e; }
    select, input[type="text"] {
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 8px 12px;
      font-size: 14px;
      margin-top: 4px;
    }
    select:focus, input:focus { outline: 2px solid #58a6ff; }

    .coord-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }

    #iframe-wrapper {
      width: 100%;
      max-width: 520px;
    }
    #preview-frame {
      width: 100%;
      height: 640px;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #0d1117;
    }

    #url-display {
      font-size: 12px;
      color: #8b949e;
      word-break: break-all;
      background: #21262d;
      border-radius: 4px;
      padding: 8px 10px;
      border: 1px solid #30363d;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 8px;
      color: #8b949e;
    }
  </style>
</head>
<body>

<h1>🔭 Aladin Panel — Test Harness</h1>
<p>Select a SPHEREx target and click <strong>Load Panel</strong> to test <code>aladin_panel.html</code> with the corresponding URL parameters.</p>

<div class="card">

  <div>
    <label for="target-select">Target</label>
    <select id="target-select">
      <option value="barnard"    data-ra="269.4521" data-dec="+4.6933">Barnard's Star</option>
      <option value="eps_indi_b" data-ra="330.84"   data-dec="-56.786">eps Indi B</option>
      <option value="wise0855"   data-ra="129.0"    data-dec="-11.0">WISE 0855−0714 (approx.)</option>
      <option value="rw_aur"     data-ra="72.77"    data-dec="+28.44">RW Aur</option>
      <option value="r_dra"      data-ra="267.4"    data-dec="+65.6">R Dra</option>
    </select>
  </div>

  <div class="coord-row">
    <div>
      <label for="ra-input">RA (deg) — override</label>
      <input type="text" id="ra-input" placeholder="auto from target">
    </div>
    <div>
      <label for="dec-input">Dec (deg) — override</label>
      <input type="text" id="dec-input" placeholder="auto from target">
    </div>
  </div>

  <div id="url-display">URL will appear here…</div>

  <div class="badges" id="coord-badges"></div>

  <button id="load-btn" type="button">▶ Load Panel</button>

</div>

<div id="iframe-wrapper">
  <iframe id="preview-frame" title="Aladin Panel Preview" src="about:blank"></iframe>
</div>

<script>
const TARGETS = {
  barnard:    { ra: 269.4521, dec:  +4.6933, label: "Barnard's Star"       },
  eps_indi_b: { ra: 330.84,   dec: -56.786,  label: "eps Indi B"           },
  wise0855:   { ra: 129.0,    dec: -11.0,    label: "WISE 0855−0714"       },
  rw_aur:     { ra:  72.77,   dec: +28.44,   label: "RW Aur"               },
  r_dra:      { ra: 267.4,    dec: +65.6,    label: "R Dra"                },
};

const select    = document.getElementById("target-select");
const raInput   = document.getElementById("ra-input");
const decInput  = document.getElementById("dec-input");
const urlDisp   = document.getElementById("url-display");
const badges    = document.getElementById("coord-badges");
const frame     = document.getElementById("preview-frame");
const loadBtn   = document.getElementById("load-btn");

function getCoords() {
  const key = select.value;
  const t   = TARGETS[key];
  const ra  = raInput.value.trim()  !== "" ? parseFloat(raInput.value)  : t.ra;
  const dec = decInput.value.trim() !== "" ? parseFloat(decInput.value) : t.dec;
  return { key, ra, dec };
}

function buildURL({ key, ra, dec }) {
  const base = "aladin_panel.html";
  return `${base}?target=${encodeURIComponent(key)}&ra=${ra}&dec=${dec}`;
}

function updateDisplay() {
  const coords = getCoords();
  const url    = buildURL(coords);
  urlDisp.textContent = url;

  badges.innerHTML = `
    <span class="badge">RA ${coords.ra}</span>
    <span class="badge">Dec ${coords.dec}</span>
    <span class="badge">${TARGETS[coords.key].label}</span>
  `;
}

select.addEventListener("change", () => {
  raInput.value  = "";
  decInput.value = "";
  updateDisplay();
});
raInput.addEventListener("input",  updateDisplay);
decInput.addEventListener("input", updateDisplay);

loadBtn.addEventListener("click", () => {
  const coords = getCoords();
  const url    = buildURL(coords);
  frame.src    = url;
  urlDisp.textContent = "Loaded: " + url;
});

// Init
updateDisplay();

// Quick-test all 5 targets in console
console.table(
  Object.entries(TARGETS).map(([k, v]) => ({
    key: k,
    label: v.label,
    url: buildURL({ key: k, ra: v.ra, dec: v.dec }),
  }))
);
</script>

</body>
</html>
